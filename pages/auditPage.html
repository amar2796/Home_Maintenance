      <div id="auditPage" class="page">
        <div class="card">
          <h3>
            <i class="fa-solid fa-shield-halved" style="color:#f87171;"></i> Audit Log
            <span style="font-size:11px;font-weight:400;color:#999;margin-left:6px;">All actions, logins &amp; device
              info</span>
            <span id="audit_count_badge"
              style="margin-left:auto;font-size:11px;background:#334155;color:#fff;padding:3px 10px;border-radius:20px;font-weight:600;display:none;"></span>
          </h3>

          <!-- Stats Row -->
          <div id="audit_stats"
            style="display:none;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px;">
            <div style="background:#f0fdf4;border:1px solid #86efac;border-radius:10px;padding:12px;text-align:center;">
              <div style="font-size:22px;font-weight:800;color:#16a34a;" id="audit_stat_logins">—</div>
              <div style="font-size:11px;color:#15803d;font-weight:600;">Logins Today</div>
            </div>
            <div style="background:#fef9ee;border:1px solid #5EEAD4;border-radius:10px;padding:12px;text-align:center;">
              <div style="font-size:22px;font-weight:800;color:#d97706;" id="audit_stat_actions">—</div>
              <div style="font-size:11px;color:#92400e;font-weight:600;">Actions Today</div>
            </div>
            <div style="background:#fef2f2;border:1px solid #fca5a5;border-radius:10px;padding:12px;text-align:center;">
              <div style="font-size:22px;font-weight:800;color:#dc2626;" id="audit_stat_total">—</div>
              <div style="font-size:11px;color:#991b1b;font-weight:600;">Total Entries</div>
            </div>
            <div style="background:#f0f4ff;border:1px solid #99F6E4;border-radius:10px;padding:12px;text-align:center;">
              <div style="font-size:22px;font-weight:800;color:#0F766E;" id="audit_stat_users">—</div>
              <div style="font-size:11px;color:#3730a3;font-weight:600;">Unique Users</div>
            </div>
          </div>

          <!-- Controls -->
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;"
            class="search-refresh-row">
            <input class="search-bar" id="auditSearch" placeholder="🔍 Search user, action, device, location..."
              onkeyup="filterAuditLog()" style="margin:0;flex:1;min-width:180px;" />
            <select id="auditFilterAction" onchange="filterAuditLog()"
              style="padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-family:Poppins,sans-serif;font-size:12px;min-width:130px;background:#fff;">
              <option value="">All Actions</option>
              <option value="login">Login</option>
              <option value="logout">Logout</option>
              <option value="contribution">Contribution</option>
              <option value="expense">Expense</option>
              <option value="user">User</option>
              <option value="email">Email / Receipt</option>
              <option value="password">Password Reset</option>
              <option value="goal">Goal</option>
              <option value="gallery">Gallery</option>
            </select>
            <button id="auditTodayBtn" onclick="_auditFilterToday()" title="Show only today's entries"
              style="background:#0F766E;box-shadow:none;padding:9px 14px;flex-shrink:0;font-size:12px;">
              <i class="fa-solid fa-calendar-day"></i> Today
            </button>
            <button onclick="loadAuditLog()" style="background:#334155;box-shadow:none;padding:9px 14px;flex-shrink:0;">
              <i class="fa-solid fa-rotate"></i> Refresh
            </button>
            <button onclick="exportAuditCSV()"
              style="background:#27ae60;box-shadow:none;padding:9px 14px;flex-shrink:0;font-size:12px;">
              <i class="fa-solid fa-file-csv"></i> CSV
            </button>
          </div>

          <!-- Table -->
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Timestamp</th>
                  <th>User / Admin</th>
                  <th>Action</th>
                  <th>Details</th>
                  <th>Reason / Purpose</th>
                  <th>Device / Info</th>
                </tr>
              </thead>
              <tbody id="auditTableBody">
                <tr>
                  <td colspan="6" style="text-align:center;color:#aaa;padding:20px;">
                    Click Refresh to load audit log
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div id="audit_pagination"
            style="display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap;"></div>
        </div>
      </div>
