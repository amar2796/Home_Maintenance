      <div id="masterPage" class="page">
        <style>
          .md-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;}
          .md-card{background:#fff;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,0.05);overflow:hidden;margin-bottom:0;}
          .md-card-hdr{padding:13px 16px 11px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:10px;}
          .md-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
          .md-card-meta{flex:1;min-width:0;}
          .md-card-title{font-size:13px;font-weight:600;color:#334155;}
          .md-card-sub{font-size:11px;color:#94a3b8;margin-top:1px;}
          .md-count{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;flex-shrink:0;}
          .md-add-row{padding:10px 12px;border-bottom:1px solid #f1f5f9;display:flex;gap:6px;}
          .md-add-input{flex:1;border:1px solid #e2e8f0;border-radius:8px;padding:7px 10px;font-size:12px;font-family:Poppins,sans-serif;outline:none;margin:0;transition:border-color 0.2s;}
          .md-add-input:focus{border-color:#0F766E;}
          .md-add-btn{border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;flex-shrink:0;transition:opacity 0.2s;}
          .md-add-btn:hover{opacity:0.88;}
          .md-list{padding:4px 0;min-height:32px;}
          .md-row{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid #f8fafc;position:relative;}
          .md-row:last-child{border-bottom:none;}
          .md-row:hover{background:#fdfbf7;}
          .md-drag{display:flex;flex-direction:column;gap:2.5px;cursor:grab;padding:2px 3px;flex-shrink:0;opacity:0.25;}
          .md-drag span{display:block;width:11px;height:1.5px;background:#334155;border-radius:1px;}
          .md-row:hover .md-drag{opacity:0.5;}
          .md-num{font-size:10px;color:#cbd5e1;width:16px;text-align:right;flex-shrink:0;font-family:monospace;}
          .md-name{flex:1;font-size:13px;color:#334155;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
          .md-actions{display:flex;gap:3px;flex-shrink:0;opacity:0;transition:opacity 0.15s;}
          .md-row:hover .md-actions{opacity:1;}
          .md-edit-active .md-actions{opacity:1;}
          .md-ibtn{background:none;border:1px solid #e2e8f0;border-radius:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#64748b;font-size:11px;padding:0;transition:background 0.15s,border-color 0.15s;}
          .md-ibtn:hover{background:#f1f5f9;color:#334155;}
          .md-ibtn:disabled{opacity:0.18;cursor:not-allowed;pointer-events:none;}
          .md-ibtn.del:hover{background:#fef2f2;color:#e74c3c;border-color:#fca5a5;}
          .md-ibtn.save:hover{background:#eafaf1;color:#27ae60;border-color:#6ee7b7;}
          .md-ibtn.cancel:hover{background:#f8fafc;color:#334155;}
          .md-edit-input{flex:1;border:1.5px solid #0F766E;border-radius:6px;padding:4px 8px;font-size:12px;font-family:Poppins,sans-serif;outline:none;min-width:0;background:#fffdf7;}
          .md-footer{padding:7px 12px 8px;border-top:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;}
          .md-hint{font-size:10px;color:#cbd5e1;}
          .md-saved{font-size:10px;color:#27ae60;opacity:0;transition:opacity 0.3s;}
          .md-empty{padding:28px;text-align:center;color:#94a3b8;font-size:12px;}
          @media(max-width:600px){.md-grid{grid-template-columns:1fr;}}
        </style>
        <div class="md-grid">

          <!-- Contribution Types -->
          <div class="md-card">
            <div class="md-card-hdr">
              <div class="md-icon" style="background:#e6f1fb;color:#185fa5;"><i class="fa-solid fa-tags"></i></div>
              <div class="md-card-meta">
                <div class="md-card-title">Contribution types</div>
                <div class="md-card-sub">Used in Add Contribution form</div>
              </div>
              <span class="md-count" style="background:#e6f1fb;color:#185fa5;" id="md_typesCount">—</span>
            </div>
            <div class="md-add-row">
              <input class="md-add-input" id="t_name" placeholder="New type name…" onkeydown="if(event.key==='Enter')addType()" />
              <button class="md-add-btn" style="background:#185fa5;color:#fff;" onclick="addType()">
                <i class="fa-solid fa-plus" style="font-size:10px;"></i> Add
              </button>
            </div>
            <div id="typeList" class="md-list"></div>
            <div class="md-footer">
              <span class="md-hint"><i class="fa-solid fa-arrows-up-down" style="font-size:9px;margin-right:3px;"></i>Arrows reorder — saved to sheet</span>
              <span class="md-saved" id="md_typesSaved">✓ Saved</span>
            </div>
          </div>

          <!-- Occasions -->
          <div class="md-card">
            <div class="md-card-hdr">
              <div class="md-icon" style="background:#eaf3de;color:#3b6d11;"><i class="fa-solid fa-star"></i></div>
              <div class="md-card-meta">
                <div class="md-card-title">Occasions</div>
                <div class="md-card-sub">Special events &amp; festivals</div>
              </div>
              <span class="md-count" style="background:#eaf3de;color:#3b6d11;" id="md_occasionsCount">—</span>
            </div>
            <div class="md-add-row">
              <input class="md-add-input" id="o_name" placeholder="New occasion…" onkeydown="if(event.key==='Enter')addOccasion()" />
              <button class="md-add-btn" style="background:#3b6d11;color:#fff;" onclick="addOccasion()">
                <i class="fa-solid fa-plus" style="font-size:10px;"></i> Add
              </button>
            </div>
            <div id="occasionList" class="md-list"></div>
            <div class="md-footer">
              <span class="md-hint"><i class="fa-solid fa-arrows-up-down" style="font-size:9px;margin-right:3px;"></i>Arrows reorder — saved to sheet</span>
              <span class="md-saved" id="md_occasionsSaved">✓ Saved</span>
            </div>
          </div>

          <!-- Expense Types -->
          <div class="md-card">
            <div class="md-card-hdr">
              <div class="md-icon" style="background:#faece7;color:#993c1d;"><i class="fa-solid fa-receipt"></i></div>
              <div class="md-card-meta">
                <div class="md-card-title">Expense types</div>
                <div class="md-card-sub">Categories for expense entries</div>
              </div>
              <span class="md-count" style="background:#faece7;color:#993c1d;" id="md_expCount">—</span>
            </div>
            <div class="md-add-row">
              <input class="md-add-input" id="e_name" placeholder="New expense type…" onkeydown="if(event.key==='Enter')addExpenseType()" />
              <button class="md-add-btn" style="background:#993c1d;color:#fff;" onclick="addExpenseType()">
                <i class="fa-solid fa-plus" style="font-size:10px;"></i> Add
              </button>
            </div>
            <div id="expenseList" class="md-list"></div>
            <div class="md-footer">
              <span class="md-hint"><i class="fa-solid fa-arrows-up-down" style="font-size:9px;margin-right:3px;"></i>Arrows reorder — saved to sheet</span>
              <span class="md-saved" id="md_expSaved">✓ Saved</span>
            </div>
          </div>

        </div>
      </div>
