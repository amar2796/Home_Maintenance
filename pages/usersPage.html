<div id="usersPage" class="page">
        <!-- Action Bar -->
        <div class="sp-action-bar">
          <div class="sp-action-bar-title">
            <i class="fa-solid fa-users"></i> Users
          </div>
          <div class="sp-action-btns">
            <button class="sp-action-btn sp-btn-indigo" onclick="spOpen('user')">
              <i class="fa-solid fa-user-plus"></i> Add User
            </button>
          </div>
        </div>
        <div class="card-v2">
          <h3>
            <span><i class="fa-solid fa-users-gear"></i> Manage Users <span style="font-size:11px;font-weight:400;color:#999;">(click row to view · edit via button)</span></span>
            <div class="wave-bar status-tabs" id="userStatusTabs" style="margin-left:auto;">
              <button class="wave-tab status-tab active" data-color="#334155" onclick="filterUsers('all',this)"><i class="fa-solid fa-list"></i> All <span class="tab-ct" id="ct_all">0</span></button>
              <button class="wave-tab status-tab tab-pending" data-color="#d97706" onclick="filterUsers('pending',this)"><i class="fa-solid fa-clock"></i> Pending <span class="tab-ct" id="ct_pending">0</span></button>
              <button class="wave-tab status-tab tab-approved" data-color="#16a34a" onclick="filterUsers('active',this)"><i class="fa-solid fa-circle-check"></i> Approved <span class="tab-ct" id="ct_approved">0</span></button>
              <button class="wave-tab status-tab tab-rejected" data-color="#dc2626" onclick="filterUsers('rejected',this)"><i class="fa-solid fa-circle-xmark"></i> Rejected <span class="tab-ct" id="ct_rejected">0</span></button>
            </div>
          </h3>
          <input class="search-bar" id="userSearchInput" placeholder="🔍 Search by Name or Mobile..." />
          <!-- PREVIEW: bulk action bar -->
          <div class="bulk-bar-v2" id="users_bulkBar">
            <span class="count"><span id="users_bulkCount">0</span> selected</span>
            <div class="spacer"></div>
            <button class="btn-v2 btn-v2-sm btn-v2-outline" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.3);" onclick="alert('Preview only \u2014 bulk approve is not wired to real data in this mockup.')"><i class="fa-solid fa-check"></i> Approve Selected</button>
          </div>
          <div class="table-v2-wrap">
            <div class="table-v2-scroll">
            <table class="table-v2">
              <thead>
                <tr>
                  <th class="row-check"><input type="checkbox" onchange="_bulkToggleAll(this,'userTable','users_bulkBar','users_bulkCount')"></th>
                  <th>Photo</th>
                  <th>Name</th>
                  <th>Mobile</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="userTable"></tbody>
            </table>
          </div></div>
          <div id="users_pagination" class="pagination-bar"></div>
        </div>
      </div>

      <!-- GOALS -->
