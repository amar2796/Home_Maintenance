      <div id="contributionRequestsPage" class="page">
        <div class="card">
          <h3 style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
            <span><i class="fa-solid fa-inbox" style="color:#0F766E;"></i> Member Contribution Requests
              <span id="reqPageBadge"
                style="background:#e74c3c;color:#fff;border-radius:12px;padding:2px 8px;font-size:11px;font-weight:700;margin-left:6px;display:none;"></span>
            </span>
            <button onclick="loadContributionRequests()"
              style="background:#334155;box-shadow:none;padding:8px 14px;font-size:12px;display:flex;align-items:center;gap:6px;">
              <i class="fa-solid fa-rotate-right"></i> Refresh
            </button>
          </h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
            <select id="reqFilterStatus" onchange="renderContributionRequests()"
              style="padding:8px 12px;border:1.5px solid #e8e8e8;border-radius:8px;font-size:13px;">
              <option value="">All Status</option>
              <option value="Pending">Pending</option>
              <option value="Approved">Approved</option>
              <option value="Rejected">Rejected</option>
            </select>
            <input id="reqFilterSearch" placeholder="🔍 Search name, amount, month..."
              onkeyup="renderContributionRequests()"
              style="flex:1;min-width:180px;padding:8px 12px;border:1.5px solid #e8e8e8;border-radius:8px;font-size:13px;" />
          </div>
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Member</th>
                  <th>Amount</th>
                  <th>Month / Year</th>
                  <th>Mode</th>
                  <th>UTR / Ref</th>
                  <th>Slip</th>
                  <th>Status</th>
                  <th>Requested On</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="reqTbody">
                <tr>
                  <td colspan="10" style="text-align:center;color:#aaa;padding:24px;">Loading...</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div id="req_pagination" class="pagination-bar"></div>
        </div>
      </div>
