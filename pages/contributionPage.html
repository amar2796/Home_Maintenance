      <div id="contributionPage" class="page">
        <!-- Action Bar -->
        <div class="sp-action-bar">
          <div class="sp-action-bar-title">
            <i class="fa-solid fa-hand-holding-dollar"></i> Contributions
          </div>
          <div class="sp-action-btns">
            <button class="sp-action-btn sp-btn-primary" onclick="spOpen('contrib')">
              <i class="fa-solid fa-plus"></i> Add Contribution
            </button>
            <button class="sp-action-btn sp-btn-dark" onclick="openBulkInsert()">
              <i class="fa-solid fa-layer-group"></i> Bulk Insert
            </button>
            <button class="sp-action-btn sp-btn-brown" onclick="openWalkInContribution()">
              <i class="fa-solid fa-person-walking-arrow-right"></i> Walk-in Entry
            </button>
          </div>
        </div>
        <div class="card">
          <h3 style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
            <span>
              <i class="fa-solid fa-list-ul"></i> Contribution Records
              <span style="font-size: 11px; font-weight: 400; color: #999">
                (click row to view · edit/delete via buttons)
              </span>
            </span>
            <button onclick="exportContribCSV()"
              style="background:#27ae60;box-shadow:none;padding:8px 14px;font-size:12px;display:flex;align-items:center;gap:6px;">
              <i class="fa-solid fa-file-csv"></i> Export CSV
            </button>
          </h3>
          <!-- PREVIEW: collapsible filter panel (was always-open) -->
          <div class="filter-v2" id="cr_filterV2">
            <div class="filter-v2-head" onclick="document.getElementById('cr_filterV2').classList.toggle('open')">
              <i class="fa-solid fa-sliders" style="color:#0F766E;"></i>
              <span style="font-weight:600;">Filters</span>
              <span class="chip" id="cr_filterCount" style="display:none;">0 active</span>
              <i class="fa-solid fa-chevron-down caret"></i>
            </div>
            <div class="filter-v2-body">
          <div class="ct-pf-panel" style="margin-bottom:14px;border:none;padding:0;">
            <div class="ct-pf-header">
              <div class="ct-pf-title">
              </div>
              <div style="display:flex;align-items:center;gap:10px;">
                <span class="ct-pf-hint">All filters combine together</span>
                <button onclick="clearContribFilters()" style="background:transparent;border:1.5px solid #e2e8f0;color:#64748b;border-radius:7px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:none;display:flex;align-items:center;gap:5px;line-height:1;transition:border-color .2s,color .2s;" onmouseover="this.style.borderColor='#0F766E';this.style.color='#0F766E';" onmouseout="this.style.borderColor='#e2e8f0';this.style.color='#64748b';">
                  <i class="fa-solid fa-rotate-left" style="font-size:10px;"></i> Clear All
                </button>
              </div>
            </div>
            <div class="ct-pf-g5" style="margin-bottom:8px;">
              <div>
                <span class="ct-pf-lbl">Year</span>
                <select class="ct-pf-sel" id="cr_filterYear" onchange="filterContributions()">
                  <option value="">All Years</option>
                </select>
              </div>
              <div>
                <span class="ct-pf-lbl">Month</span>
                <select class="ct-pf-sel" id="cr_filterMonth" onchange="filterContributions()">
                  <option value="">All Months</option>
                  <option>January</option><option>February</option><option>March</option>
                  <option>April</option><option>May</option><option>June</option>
                  <option>July</option><option>August</option><option>September</option>
                  <option>October</option><option>November</option><option>December</option>
                </select>
              </div>
              <div>
                <span class="ct-pf-lbl">Member / Name</span>
                <input class="ct-pf-inp" id="cr_filterName" placeholder="Type name or mobile…" oninput="_debouncedFilterContrib()" />
              </div>
              <div>
                <span class="ct-pf-lbl">Tracking ID</span>
                <input class="ct-pf-inp" id="cr_filterTrackID" placeholder="Tracking ID…" oninput="_debouncedFilterContrib()" />
              </div>
              <div>
                <span class="ct-pf-lbl">Contribution Type</span>
                <select class="ct-pf-sel" id="filterContribType" onchange="filterContributions()">
                  <option value="">All Types</option>
                </select>
              </div>
            </div>
            <div class="ct-pf-g5">
              <div>
                <span class="ct-pf-lbl">Occasion</span>
                <select class="ct-pf-sel" id="cr_filterOccasion" onchange="filterContributions()">
                  <option value="">All Occasions</option>
                </select>
              </div>
              <div>
                <span class="ct-pf-lbl">Member Type</span>
                <select class="ct-pf-sel" id="cr_filterMemberType" onchange="filterContributions()">
                  <option value="">All</option>
                  <option value="member">Members Only</option>
                  <option value="walkin">Walk-in Only</option>
                </select>
              </div>
            </div>
            <!-- Active filter tags -->
            <div class="ct-tags" id="cr_activeTags" style="margin-top:8px;"></div>
          </div>
            </div>
          </div>
          <!-- PREVIEW: bulk action bar (appears once rows are checked) -->
          <div class="bulk-bar-v2" id="cr_bulkBar">
            <span class="count"><span id="cr_bulkCount">0</span> selected</span>
            <div class="spacer"></div>
            <button class="btn-v2 btn-v2-sm btn-v2-outline" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.3);" onclick="exportSelectedContribCSV()"><i class="fa-solid fa-file-csv"></i> Export Selected</button>
            <button class="btn-v2 btn-v2-sm btn-v2-danger" style="background:transparent;color:#fca5a5;border-color:rgba(252,165,165,.4);" onclick="deleteSelectedContribs()"><i class="fa-solid fa-trash"></i> Delete Selected</button>
          </div>
          <div class="table-v2-wrap">
            <div class="table-v2-scroll">
            <table class="table-v2">
              <thead>
                <tr>
                  <th class="row-check"><input type="checkbox" id="cr_checkAll" onchange="_cr2ToggleAll(this)"></th>
                  <th>#</th>
                  <th>Name</th>
                  <th>Amount</th>
                  <th>Month</th>
                  <th>Year</th>
                  <th>Type</th>
                  <th>Tracking ID</th>
                  <th>Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="tb"></tbody>
            </table>
            </div>
          </div>
          <div id="contrib_pagination" class="pagination-bar"></div>
        </div>
      </div>

      <!-- EXPENSES -->
